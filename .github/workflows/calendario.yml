# Aggiorna il "Calendario situazionale" da Google Calendar ogni ora
# e quando lo avvii a mano (Actions > Aggiorna calendario > Run workflow).
name: Aggiorna calendario

on:
  schedule:
    - cron: "17 * * * *"   # ogni ora (GitHub può partire con ritardo)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: calendario
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera il calendario
        run: python3 scripts/calendario.py

      - name: Pubblica se è cambiato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Nessuna modifica."
            exit 0
          fi
          git config user.name "calendario-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Calendario aggiornato da Google Calendar"
          git push
          # chiede a GitHub Pages di ripubblicare il sito
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
